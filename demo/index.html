<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PagedAttention WebGPU — Virtual Memory Visualizer</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #121826;
      --accent: #00f0ff;
      --accent-dim: rgba(0, 240, 255, 0.2);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --free: #238636;
      --inuse: #1f6feb;
      --shared: #a371f7;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
    }
    h1 { margin-top: 0; color: var(--accent); }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .blocks-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 15px; }
    .block {
      width: 38px; height: 38px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; border: 1px solid rgba(255,255,255,0.1);
    }
    .free { background: rgba(35, 134, 54, 0.3); border-color: var(--free); color: #3fb950; }
    .inuse { background: rgba(31, 111, 235, 0.3); border-color: var(--inuse); color: #58a6ff; }
    .shared { background: rgba(163, 113, 247, 0.3); border-color: var(--shared); color: #bc8cff; }
    button {
      background: var(--accent); color: #000; border: none; padding: 8px 16px;
      border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 8px;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h1>⚡ PagedAttention WebGPU Virtual Memory Visualizer</h1>
  <p>Real-time physical block allocation, block table translation, and zero-fragmentation KV-cache simulation.</p>

  <div class="grid">
    <div class="card">
      <h3>Physical Block Pool (WebGPU Storage Buffer)</h3>
      <div id="pool-stats">Allocated: 0 / 64 blocks</div>
      <div style="display: flex; gap: 15px; margin-top: 10px; font-size: 12px;">
        <span><span style="display: inline-block; width: 10px; height: 10px; background: #3fb950; border-radius: 2px;"></span> Free</span>
        <span><span style="display: inline-block; width: 10px; height: 10px; background: #58a6ff; border-radius: 2px;"></span> In-Use</span>
        <span><span style="display: inline-block; width: 10px; height: 10px; background: #bc8cff; border-radius: 2px;"></span> Shared (Prefix)</span>
      </div>
      <div class="blocks-container" id="block-grid"></div>
    </div>
    <div class="card">
      <h3>Controls & Actions</h3>
      <button id="btn-add-seq">Add Sequence (+Prompt)</button>
      <button id="btn-step-token">Generate Token (+1)</button>
      <button id="btn-fork-seq">Fork Sequence (CoW)</button>
      <button id="btn-free-seq">Free Sequence</button>
      <div id="seq-info" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script type="module" src="visualizer.ts"></script>
</body>
</html>
